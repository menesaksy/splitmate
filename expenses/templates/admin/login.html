{% extends "jazzmin/login.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
/* Arka plan */
body.login-page {
    background: #0c0e14 !important;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Dış kart kaldır */
.login-logo { display: none !important; }

/* Ana kutu */
.login-box {
    width: 380px !important;
    background: #13161f !important;
    border: 1px solid #1c2030 !important;
    border-radius: 16px !important;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7) !important;
    padding: 0 !important;
    overflow: hidden !important;
}

/* Üst banner */
.login-box::before {
    content: '';
    display: block;
    height: 4px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #6366f1);
    background-size: 200% 100%;
    animation: shimmer 2s infinite;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.card-body, .login-card-body {
    padding: 36px 32px !important;
    background: transparent !important;
}

/* Logo alanı */
.login-box-msg {
    text-align: center !important;
    padding: 0 0 28px 0 !important;
    margin: 0 !important;
    border-bottom: 1px solid #1c2030 !important;
    margin-bottom: 28px !important;
}

.login-box-msg::before {
    content: '💰';
    font-size: 36px;
    display: block;
    margin-bottom: 10px;
}

.login-box-msg::after {
    content: 'SplitMate Yönetim Paneli';
    display: block;
    font-size: 20px;
    font-weight: 700;
    color: #e2e8f0;
    margin-top: -18px;
    margin-bottom: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* Giriş metni gizle */
.login-box-msg span {
    display: none !important;
}

/* Input alanları */
.input-group {
    margin-bottom: 16px !important;
}

.form-control {
    background: #0c0e14 !important;
    border: 1px solid #1c2030 !important;
    border-right: none !important;
    color: #e2e8f0 !important;
    border-radius: 8px 0 0 8px !important;
    height: 46px !important;
    font-size: 14px !important;
    padding: 0 16px !important;
    transition: border-color 0.2s ease !important;
}

.form-control:focus {
    border-color: #6366f1 !important;
    box-shadow: none !important;
    background: #0f1117 !important;
    outline: none !important;
}

.form-control::placeholder {
    color: #3d4660 !important;
}

.input-group-text, .input-group-addon {
    background: #0c0e14 !important;
    border: 1px solid #1c2030 !important;
    border-left: none !important;
    color: #6366f1 !important;
    border-radius: 0 8px 8px 0 !important;
    width: 46px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}

.form-control:focus + .input-group-text,
.form-control:focus + .input-group-append .input-group-text {
    border-color: #6366f1 !important;
}

/* Giriş butonu */
.btn-primary {
    width: 100% !important;
    height: 46px !important;
    background: #6366f1 !important;
    background-image: none !important;
    border: none !important;
    border-radius: 8px !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    color: #fff !important;
    letter-spacing: 0.3px !important;
    margin-top: 8px !important;
    transition: background 0.2s ease, transform 0.15s ease !important;
    box-shadow: 0 4px 15px rgba(99,102,241,0.3) !important;
}

.btn-primary:hover {
    background: #5254cc !important;
    transform: translateY(-1px) !important;
    box-shadow: 0 6px 20px rgba(99,102,241,0.45) !important;
}

.btn-primary:active {
    transform: translateY(0) !important;
}

/* Remember me */
.icheck-primary label {
    color: #4a5568 !important;
    font-size: 12px !important;
}

/* Footer */
.login-box p, .login-box a {
    color: #3d4660 !important;
    font-size: 12px !important;
}

/* Gizle gereksiz elemanlar */
.social-auth-links { display: none !important; }
</style>
{% endblock %}

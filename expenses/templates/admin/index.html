{% extends "admin/index.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Dashboard kartları */
    .card {
        border-radius: 12px !important;
        border: 1px solid rgba(99,102,241,0.15) !important;
        transition: all 0.2s ease !important;
    }
    .card:hover {
        border-color: rgba(99,102,241,0.4) !important;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3) !important;
        transform: translateY(-2px) !important;
    }
    .card-header {
        border-radius: 12px 12px 0 0 !important;
        font-weight: 600 !important;
        font-size: 13px !important;
        letter-spacing: 0.3px !important;
        border-bottom: 1px solid rgba(255,255,255,0.05) !important;
        padding: 14px 18px !important;
    }
    .card-body {
        padding: 16px 18px !important;
    }

    /* Model link'leri */
    .model-name {
        font-size: 13px !important;
        font-weight: 500 !important;
        color: #a0aec0 !important;
        transition: color 0.15s ease !important;
    }
    .model-name:hover { color: #6366f1 !important; }

    /* Add/Change butonları */
    .addlink, .changelink {
        border-radius: 6px !important;
        font-size: 11px !important;
        font-weight: 600 !important;
        padding: 3px 10px !important;
        transition: all 0.15s ease !important;
    }

    /* Recent actions */
    #recent-actions-module {
        border-radius: 12px !important;
        border: 1px solid rgba(99,102,241,0.15) !important;
    }

    /* Stats banner */
    .dashboard-banner {
        background: linear-gradient(135deg, #1a1f2e 0%, #1e2436 100%);
        border: 1px solid rgba(99,102,241,0.2);
        border-radius: 12px;
        padding: 20px 24px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
    }
    .dashboard-banner-title {
        font-size: 18px;
        font-weight: 600;
        color: #e2e8f0;
        margin: 0;
    }
    .dashboard-banner-sub {
        font-size: 12px;
        color: #4a5568;
        margin-top: 3px;
    }
    .dashboard-stat {
        text-align: center;
        min-width: 80px;
    }
    .dashboard-stat-value {
        font-size: 22px;
        font-weight: 700;
        color: #6366f1;
        line-height: 1;
    }
    .dashboard-stat-label {
        font-size: 10px;
        color: #4a5568;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 4px;
    }
    .dashboard-stat-divider {
        width: 1px;
        height: 40px;
        background: rgba(99,102,241,0.2);
    }
</style>
{% endblock %}

{% block content %}
<div class="dashboard-banner">
    <div>
        <div class="dashboard-banner-title">👋 Hoşgeldiniz, {{ user.username|capfirst }}</div>
        <div class="dashboard-banner-sub">SplitMate Yönetim Paneli · Bugün: {% now "d M Y" %}</div>
    </div>
    <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
        <div class="dashboard-stat">
            <div class="dashboard-stat-value" id="stat-users">—</div>
            <div class="dashboard-stat-label">Kullanıcı</div>
        </div>
        <div class="dashboard-stat-divider"></div>
        <div class="dashboard-stat">
            <div class="dashboard-stat-value" id="stat-groups">—</div>
            <div class="dashboard-stat-label">Grup</div>
        </div>
        <div class="dashboard-stat-divider"></div>
        <div class="dashboard-stat">
            <div class="dashboard-stat-value" id="stat-expenses">—</div>
            <div class="dashboard-stat-label">Harcama</div>
        </div>
    </div>
</div>
{{ block.super }}
<script>
// Admin API'den istatistikleri çek
async function loadStats() {
    try {
        const r = await fetch('/api/groups/?page_size=1', {credentials:'include'});
        // Basit fallback — sayfa yüklenince DOM'dan say
        const userLinks = document.querySelectorAll('.model-auth_user td.field-__str__');
        const groupLinks = document.querySelectorAll('.model-group td.field-__str__');
    } catch(e) {}
}
loadStats();
</script>
{% endblock %}
